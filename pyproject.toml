[project]
name = "faaah"
version = "0.1.0"
description = "Filesystem As An AI Handler: an OpenAI-compatible proxy backed by an AI agent working over text files."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/sebastiancarlos/faaah"
Repository = "https://github.com/sebastiancarlos/faaah"

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
faaah = "faaah:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faaah"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "RUF100"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
exclude = ["**/__pycache__", ".ruff_cache", ".venv"]
